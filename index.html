<!DOCTYPE html>
<!--
  کاوشگر مثلثات: نسبت‌های مثلثاتی، پایه‌ی دهم
  توسعه و طراحی: زینب صفری
  فایل تک‌صفحه‌ای و بدون نیاز به اینترنت. برای اجرا فقط آن را در مرورگر باز کنید.
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4338ca">
<title>کاوشگر مثلثات</title>
<style>
/* ── فونت: اگر فایل‌های Vazirmatn کنار این فایل باشند استفاده می‌شوند ── */
@font-face {
  font-family:Vazirmatn;
  font-weight:400;
  src:local("Vazirmatn"),local("Vazirmatn Regular"),url("Vazirmatn-Regular.woff2") format("woff2");
}
@font-face {
  font-family:Vazirmatn;
  font-weight:700;
  src:local("Vazirmatn Bold"),url("Vazirmatn-Bold.woff2") format("woff2");
}
.reset {
  display:block;
  margin:14px auto 4px;
  background:transparent;
  border:0;
  box-shadow:none;
  color:#94a3b8;
  font-size:.8rem;
  font-weight:400;
  text-decoration:underline;
}

/* ── پایه: متغیرها، بدنه، کارت‌ها، دکمه‌ها، جدول و کسر ── */
:root {
  --p:#4338ca;
  --ok:#059669;
  --t:#1e293b;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  font-family:Vazirmatn,Tahoma,sans-serif;
  font-size:16px;
  line-height:1.9;
  color:var(--t);
  background:linear-gradient(160deg,#eef2ff,#fdf2f8);
  min-height:100vh;
}
.wrap {
  max-width:560px;
  margin:0 auto;
  padding:12px;
}
header {
  text-align:center;
}
h1 {
  font-size:1.15rem;
  margin:4px 0;
  color:var(--p);
}
small {
  color:#64748b;
}
#prog {
  display:flex;
  gap:6px;
  justify-content:center;
  margin:8px 0;
}
#prog b {
  flex:1;
  max-width:90px;
  height:8px;
  border-radius:5px;
  background:#cbd5e1;
}
#prog b.on {
  background:var(--p);
}
#prog b.done {
  background:var(--ok);
}
.card {
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 6px 18px #0001;
}
svg {
  width:100%;
  height:auto;
  display:block;
  touch-action:manipulation;
}
button {
  font:inherit;
  font-weight:500;
  border:0;
  border-radius:12px;
  padding:8px 14px;
  margin:4px;
  background:#e0e7ff;
  color:var(--p);
  cursor:pointer;
}
button.pri {
  background:var(--p);
  color:#fff;
}
button:disabled {
  opacity:.4;
}
.msg {
  padding:10px 12px;
  border-radius:12px;
  margin:8px 0;
}
.good {
  background:#d1fae5;
  color:#065f46;
}
.bad {
  background:#fee2e2;
  color:#991b1b;
}
.info {
  background:#e0f2fe;
  color:#075985;
}
input[type=range] {
  width:100%;
}
table {
  width:100%;
  border-collapse:collapse;
  text-align:center;
}
td,th {
  border-bottom:1px solid #e2e8f0;
  padding:4px;
}
.fr {
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  vertical-align:middle;
  margin:0 4px;
  direction:ltr;
  line-height:1.5;
}
.fr i {
  font-style:normal;
  padding:0 5px;
}
.fr i:first-child {
  border-bottom:2px solid currentColor;
}
.o {
  color:#c2410c;
  font-weight:600;
}
.bl {
  color:#0369a1;
  font-weight:600;
}
.h {
  color:#6d28d9;
  font-weight:600;
}
.nm {
  background:#f1f5f9;
  border-radius:12px;
  padding:6px 12px;
  margin:8px 0;
  text-align:center;
}
.nm b {
  color:var(--p);
}
.fm {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  direction:ltr;
  font-size:1.1rem;
  font-weight:600;
  margin:4px 0;
}
.mt {
  display:inline-block;
  direction:ltr;
  unicode-bidi:isolate;
  white-space:nowrap;
  vertical-align:middle;
}
.rd {
  display:inline-flex;
  align-items:flex-start;
  direction:ltr;
}
.rb {
  border-top:2px solid currentColor;
  padding:0 2px;
  margin-right:1px;
  line-height:1.25;
}
.tile {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:right;
  background:#f8fafc;
  border:2px solid #e2e8f0;
  border-radius:14px;
  padding:10px 12px;
  margin:8px 0;
  color:var(--t);
}
.tile i {
  font-style:normal;
  font-size:1.3rem;
  min-width:28px;
  text-align:center;
  color:var(--p);
  font-weight:700;
}
.tile>span {
  display:block;
}
.tile b {
  display:block;
  color:var(--p);
}
.tile small {
  color:#64748b;
  display:block;
}
.tile.dn {
  border-color:#6ee7b7;
  background:#ecfdf5;
}
footer {
  text-align:center;
  color:#64748b;
  font-size:.8rem;
  padding:6px;
}
@keyframes bm {
  to {
    stroke-dashoffset:0;
  }
}

/* ── ظاهر اصلی: سربرگ، کارت‌ها، دکمه‌ها، منو، پیام‌ها و شکل ── */
body {
  font-family:Vazirmatn,Vazir,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  background:#f4f6ff radial-gradient(circle at 85% -10%,#e9d5ff 0,transparent 45%),radial-gradient(circle at 0 30%,#dbeafe 0,transparent 40%);
  background-attachment:fixed;
}
header {
  margin:-12px -12px 10px;
}
.hero {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(135deg,#4338ca,#7c3aed 55%,#db2777);
  color:#fff;
  border-radius:0 0 28px 28px;
  padding:18px 20px 16px;
  box-shadow:0 10px 24px #4338ca33;
  text-align:right;
}
.hero h1 {
  color:#fff;
  font-size:1.55rem;
  margin:0;
}
.hero p {
  margin:2px 0 6px;
  opacity:.92;
}
.hero small {
  color:#e0e7ff;
}
.hv {
  width:88px;
  flex:none;
}
#prog {
  display:block;
  padding:10px 14px 0;
  text-align:right;
}
#prog button {
  padding:5px 14px;
  font-size:.85rem;
  margin:0;
  border-radius:999px;
  box-shadow:none;
  background:#fff;
}
.card {
  border-radius:22px;
  border:1px solid #e0e7ff;
  box-shadow:0 8px 22px #4338ca14;
}
#figc {
  background-color:#fff;
  background-image:linear-gradient(#eef2ff 1px,transparent 1px),linear-gradient(90deg,#eef2ff 1px,transparent 1px);
  background-size:22px 22px;
}
#panel>* {
  animation:fade .35s both;
}
@keyframes fade {
  from {
    opacity:0;
    transform:translateY(6px);
  }
}
@keyframes pop {
  from {
    transform:scale(.94);
    opacity:0;
  }
}
button {
  font-weight:600;
  border:2px solid #c7d2fe;
  border-radius:14px;
  padding:9px 16px;
  margin:5px 4px;
  background:#fff;
  color:#4338ca;
  box-shadow:0 3px 0 #c7d2fe;
  transition:transform .12s,box-shadow .12s;
}
button:active {
  transform:translateY(3px);
  box-shadow:none;
}
button.pri {
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  border-color:#4338ca;
  box-shadow:0 3px 0 #3730a3;
}
button:disabled {
  opacity:.45;
}
.msg {
  border:1px solid;
  animation:pop .3s;
}
.good {
  background:#ecfdf5;
  border-color:#a7f3d0;
  color:#065f46;
}
.bad {
  background:#fef2f2;
  border-color:#fecaca;
  color:#991b1b;
}
.info {
  background:#eff6ff;
  border-color:#bfdbfe;
  color:#1e40af;
}
table {
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 0 0 1px #e0e7ff;
}
th {
  background:#eef2ff;
  color:#4338ca;
}
tr:nth-child(even) td {
  background:#fafbff;
}
.nm {
  background:linear-gradient(135deg,#eef2ff,#fdf2f8);
  border:1px solid #e0e7ff;
}
.tile {
  border:2px solid #e2e8f0;
  background:#fff;
  box-shadow:0 4px 12px #4338ca12;
  margin:10px 0;
  transition:transform .15s;
}
.tile:active {
  transform:scale(.98);
  box-shadow:none;
}
.tile.dn {
  border-color:#6ee7b7;
}
.tile {
  font-weight:400;
}
.tile b {
  font-weight:700;
}
.ic {
  width:50px;
  height:50px;
  border-radius:15px;
  display:grid;
  place-items:center;
  flex:none;
  box-shadow:0 4px 10px #0002;
}
.ic svg {
  width:30px;
  height:30px;
}
.ck {
  margin-inline-start:auto;
  background:#10b981;
  color:#fff;
  border-radius:50%;
  width:26px;
  height:26px;
  display:grid;
  place-items:center;
  font-style:normal;
  font-weight:700;
}
.hl {
  paint-order:stroke;
  stroke:#fff;
  stroke-width:3.5px;
  stroke-linejoin:round;
}
.cf {
  position:fixed;
  top:-16px;
  width:9px;
  height:14px;
  border-radius:2px;
  pointer-events:none;
  z-index:99;
  animation:fall 1.5s ease-in forwards;
}
@keyframes fall {
  to {
    transform:translateY(108vh) rotate(560deg);
  }
}

/* ── گزینه‌های آزمون ── */
.opt {
  display:block;
  width:100%;
  margin:8px 0;
  font-size:1.1rem;
}

/* ── فلش‌کارت برگردان ── */
.fc3d {
  perspective:900px;
  margin:12px 0;
  cursor:pointer;
}
.fc3i {
  position:relative;
  height:170px;
  transition:transform .6s;
  transform-style:preserve-3d;
}
.fc3d.fl .fc3i {
  transform:rotateY(180deg);
}
.fc3f,.fc3b {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:1.8rem;
  font-weight:700;
  border-radius:20px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border:2px solid #c7d2fe;
  box-shadow:0 6px 16px #4338ca1a;
}
.fc3f {
  background:linear-gradient(135deg,#eef2ff,#fdf2f8);
  color:#4338ca;
}
.fc3b {
  background:linear-gradient(135deg,#ecfdf5,#dbeafe);
  border-color:#6ee7b7;
  color:#065f46;
  transform:rotateY(180deg);
}

/* ── نمودار پیشرفت، پیام تکمیل و نوار آزمون ── */
.pc {
  display:flex;
  align-items:center;
  gap:14px;
  background:linear-gradient(135deg,#eef2ff,#fdf2f8);
  border:1px solid #e0e7ff;
  border-radius:20px;
  padding:12px 16px;
  margin:6px 0 10px;
}
.pc b {
  color:#4338ca;
  font-size:1.1rem;
}
.dots {
  display:flex;
  gap:4px;
  margin-top:8px;
  flex-wrap:wrap;
}
.dots i {
  width:11px;
  height:11px;
  border-radius:50%;
  background:#cbd5e1;
}
.dots i.on {
  background:linear-gradient(135deg,#10b981,#0ea5e9);
  box-shadow:0 0 0 3px #10b98130;
}
.dots i.nx {
  background:#fbbf24;
  animation:pl 1.2s infinite;
}
@keyframes pl {
  50% {
    transform:scale(1.35);
  }
}
.win {
  position:fixed;
  inset:0;
  background:#1e1b4bcc;
  display:grid;
  place-items:center;
  z-index:100;
  animation:fade .3s;
}
.wc {
  background:#fff;
  border-radius:24px;
  padding:20px 24px;
  max-width:320px;
  text-align:center;
  box-shadow:0 20px 50px #0006;
  animation:pop .45s;
}
.wc h3 {
  margin:6px 0 2px;
  color:#4338ca;
  font-size:1.25rem;
}
.wc p {
  margin:4px 0 8px;
}
.qbar {
  display:flex;
  gap:4px;
  margin:6px 0;
}
.qbar i {
  flex:1;
  height:7px;
  border-radius:4px;
  background:#e0e7ff;
}
.qbar i.ok {
  background:#10b981;
}
.qbar i.no {
  background:#f43f5e;
}
.qbar i.cur {
  background:#6366f1;
}
.tmr {
  height:10px;
  border-radius:6px;
  background:#e0e7ff;
  overflow:hidden;
  margin:6px 0;
}
.tmr i {
  display:block;
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#10b981,#f59e0b);
  border-radius:6px;
}
.tmr.lo i {
  background:#f43f5e;
}
.star {
  font-size:2.2rem;
  color:#f59e0b;
  letter-spacing:6px;
  text-align:center;
}
.pts {
  display:flex;
  justify-content:space-between;
  font-weight:700;
  color:#4338ca;
}

/* ── منوی آموزش: مسیر یادگیری ── */
.cont {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin: 4px 0 8px;
  padding: 7px 14px;
  border: 2px solid #c7d2fe;
  border-radius: 999px;
  color: #4338ca;
  background: #fff;
  box-shadow: none;
  font-weight: 400;
  font-size: .9rem;
  text-align: right;
}
.cont span { display: flex; align-items: baseline; gap: 6px; }
.cont b { font-size: 1rem; }
.cont small { color: #64748b; opacity: 1; }
.cont i { font-style: normal; font-size: .95rem; }

/* ── منوی آموزش: گروه‌های کشویی (هر گروه رنگ خودش را دارد) ── */
.grp { margin: 12px 0; --c1: #0ea5e9; --c2: #6366f1; --bg: #eff6ff; --bd: #bae6fd; }
.grp.g1 { --c1: #f59e0b; --c2: #f97316; --bg: #fffbeb; --bd: #fde68a; }
.grp.g2 { --c1: #8b5cf6; --c2: #db2777; --bg: #faf5ff; --bd: #e9d5ff; }
.gh {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin: 0;
  padding: 12px 14px;
  text-align: right;
  color: #fff;
  font-weight: 400;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  border: 0;
  border-radius: 16px;
  box-shadow: 0 5px 12px #0000002e;
}
.gh span { flex: 1; display: block; }
.gh b { display: block; font-size: 1.15rem; }
.gh small { display: block; color: #fff; opacity: .92; }
.gh em { font-style: normal; font-weight: 700; font-size: .85rem; white-space: nowrap; color: var(--c2); background: #fff; border-radius: 999px; padding: 2px 10px; }
.gh i { font-style: normal; font-size: 1.2rem; color: #fff; transition: transform .3s; }
.gh.on i { transform: rotate(180deg); }
.gb { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.gb.open { grid-template-rows: 1fr; }
.gb > div { overflow: hidden; min-height: 0; }
.in { margin: 10px 16px 2px 0; padding-right: 12px; border-right: 3px solid var(--bd); }
.step {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin: 8px 0;
  padding: 8px 12px;
  text-align: right;
  background: #fff;
  border: 2px solid var(--bd);
  border-radius: 14px;
  box-shadow: 0 2px 6px #0000000f;
  color: var(--t);
  font-weight: 400;
}
.step span { display: block; }
.step b { display: block; color: #1e293b; }
.step small { display: block; color: #64748b; }
.step em { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); border: 2px solid var(--c1); color: var(--c2); font-style: normal; font-weight: 700; }
.step.dn { background: var(--bg); }
.step.dn em { background: linear-gradient(135deg, var(--c1), var(--c2)); border-color: transparent; color: #fff; }
.step.nx { border-color: var(--c1); box-shadow: 0 0 0 3px var(--bd); }
.step.nx em { animation: pl 1.4s infinite; }

/* ── نمایش روی تبلت، لپ‌تاپ و پروژکتور ── */
#main { display: grid; gap: 16px; align-items: start; }
#main.solo { max-width: 760px; margin: 0 auto; }
.fs { margin: 6px 0 0; padding: 4px 12px; font-size: .8rem; border-radius: 999px; background: #ffffff26; border: 1px solid #ffffff66; color: #fff; box-shadow: none; }
@media (min-width: 600px) {
  body { font-size: 18px; }
  .wrap { max-width: 720px; }
}
@media (min-width: 900px) {
  body { font-size: 20px; }
  .wrap { max-width: 1240px; padding: 14px 24px; }
  header { margin: -14px -24px 12px; }
  .hero { padding: 14px 28px; }
  .hero h1 { font-size: 1.9rem; }
  .hv { width: 100px; }
  #main { grid-template-columns: 1.15fr 1fr; }
  #main.solo { grid-template-columns: 1fr; }
  #figc { position: sticky; top: 12px; }
  .card { padding: 18px; }
  .wc { max-width: 480px; }
}
@media (min-width: 1400px) {
  body { font-size: 24px; }
  .wrap { max-width: 1600px; }
  #main.solo { max-width: 900px; }
}
</style>
</head>
<body><div class="wrap">
<header><div class="hero"><div><h1>کاوشگر مثلثات</h1><p>کشف کن، پیش‌بینی کن، اثبات کن</p><small>توسعه و طراحی: زینب صفری · نسخه‌ی نهایی</small><br><button class="fs" onclick="toggleFS()">تمام‌صفحه ⛶</button></div><svg class="hv" viewBox="0 0 96 76"><path d="M10 66H84L10 14Z" fill="#fff" fill-opacity=".16"/><path d="M10 66H84" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/><path d="M10 66V14" stroke="#fdba74" stroke-width="5" stroke-linecap="round"/><path d="M10 14L84 66" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/><path d="M10 54h12v12" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M64 66a22 22 0 0 0-9-14" stroke="#fde68a" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg></div><div id="prog"></div></header>
<div id="main">
<div class="card" id="figc"><svg id="fig" viewBox="0 0 300 250"></svg></div>
<div class="card" id="panel"></div>
</div>
<footer>توسعه و طراحی: زینب صفری</footer></div>
<script>
/*
 * فهرست بخش‌های کد
 *  1) هسته            2) حروف‌چینی ریاضی   3) رسم شکل          4) ناوبری و رندر
 *  5) A شناخت اضلاع   6) B ثابت بودن نسبت‌ها  7) D تمرین نام‌گذاری  8) E زوایای ویژه
 *  9) F روابط         10) G حل مسئله        11) H ارتفاع          12) T تمرین طناب
 * 13) محاسبه‌ی مساحت  14) آزمون             15) فلش‌کارت          16) منو و پیشرفت
 *
 * داده‌های قابل ویرایش:  QZ (سوال‌های آزمون)  PB (مسئله‌ها)  EX (تمرین طناب)
 *                        AP (تمرین مساحت)      FV (فلش‌کارت)  WM (پیام‌های تکمیل)  SEC (منوی آموزش)
 * پیشرفت دانش‌آموز در localStorage با کلید trigDN ذخیره می‌شود.
 */
// ════════════════════════════════════════════════════════════
// 1) هسته: ابزارها، رنگ‌ها و وضعیت برنامه
// ════════════════════════════════════════════════════════════

const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]).replace('.', '٫');

const $ = i => document.getElementById(i);

const C = { opp: '#f97316', adj: '#0ea5e9', hyp: '#7c3aed' }, TC = { opp: '#c2410c', adj: '#0369a1', hyp: '#6d28d9' }, N = { opp: 'مقابل', adj: 'مجاور', hyp: 'وتر' }, CL = { opp: 'o', adj: 'bl', hyp: 'h' };

const S = {};

let lv = 0, spok = false, vis = {}, sel = [], q1 = false, done = false, st = 0, ph = 0, streak = 0, ask = 'opp', rows = [], pr = 0, ok0 = true;

const role = (s, t = S.tg) => s == 'AB' ? 'hyp' : ((s == 'AC') == (t == 'B') ? 'opp' : 'adj');

const msg = (c, t) => `<div class="msg ${c}">${t}</div>`;

const put = h => {
    $('panel').innerHTML = h;
    const m = $('main');
    if (m) m.classList.toggle('solo', $('figc').style.display == 'none');
};

const note = (c, t) => {
    if ($('note'))
        $('note').innerHTML = msg(c, t);
};

let selN = [], pf = null, DN = {};

try {
    DN = JSON.parse(localStorage.getItem('trigDN') || '{}');
}
catch (e) {
}

const fin = k => {
    if (!DN[k]) {
        DN[k] = 1;
        try {
            burst();
        }
        catch (e) {
        }
        try {
            showWin(k);
        }
        catch (e) {
        }
        try {

        catch (e) {
        }
    }
};

const DEF = { sin: ['opp', 'hyp'], cos: ['adj', 'hyp'], tan: ['opp', 'adj'], cot: ['adj', 'opp'] }, V = { opp: 3, adj: 4, hyp: 5 };

const frs = (n, d) => `<span class=fr><i class=${CL[n]}>${N[n]}</i><i class=${CL[d]}>${N[d]}</i></span>`;

const nf = (a, b) => `<span class=fr><i>${fa(a)}</i><i>${fa(b)}</i></span>`;

const dec = x => {
    const r = Math.round(x * 100) / 100;
    return (Math.abs(x - r) < 1e-9 ? '' : '≈') + fa(r);
};

const lf = (a, b) => `<span class=fr><i>${a}</i><i>${b}</i></span>`;

const NM = (t, f, x) => `<div class=nm><b>${t}</b><div class=fm><span>${f} =</span>${x}</div></div>`;

const svgM = x => x.replace(/√(\S+)/g, '√<tspan text-decoration="overline">$1</tspan>');

const rd = x => `<span class=rd>√<span class=rb>${fa(x)}</span></span>`, mt = h => `<span class=mt>${h}</span>`, R2 = rd(2), R3 = rd(3);

const half = lf('۱', '۲'), h2 = lf(R2, '۲'), s3 = lf(R3, '۲'), t3 = lf(R3, '۳');

const fxi = x => fa(x).replace(/√([۰-۹]+)/g, (m, d) => rd(d));

const fx = x => mt(x.split(/((?:\d*√)?\d+\/(?:\d*√)?\d+)/).map((t, i) => {
    if (i % 2) {
        const [a, b] = t.split('/');
        return lf(fxi(a), fxi(b));
    }
    return fxi(t);
}).join(''));

const tx = t => t.split(/\{([^}]*)\}/).map((q, i) => i % 2 ? fx(q) : fa(q)).join('');

// 3) رسم شکل: مثلث، زاویه و صحنه‌های مسئله

function tf() {
    const r = S.th * Math.PI / 180, c = Math.cos(r), s = Math.sin(r), u = S.k * 12, w = S.bw, h = S.bh;
    return ([x, y]) => {
        x = (x - w / 3) * S.fl;
        y = y + h / 3;
        return [150 + (S.ox || 0) + u * (x * c - y * s), 125 + (S.oy || 0) + u * (x * s + y * c)];
    };
}

function pts() {
    const f = tf(), w = S.bw, h = S.bh;
    return { A: f([0, -h]), B: f([w, 0]), C: f([0, 0]) };
}

function ctxPoly() {
    if (!S.ctx)
        return '';
    const f = tf(), w = S.bw, hh = S.bh, P = S.ctx == 'sq' ? [[0, 0], [w, 0], [w, -hh], [0, -hh]] : [[-w, 0], [w, 0], [0, -hh]];
    return `<polygon points="${P.map(q => f(q).join(',')).join(' ')}" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>`;
}

function draw() {
    if (st == 9 || st == 14) {
        drawH();
        return;
    }
    if (st == 12 || st == 13) {
        drawS();
        return;
    }
    const p = pts(), sd = { AB: [p.A, p.B], AC: [p.A, p.C], BC: [p.B, p.C] }, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], cen = [(p.A[0] + p.B[0] + p.C[0]) / 3, (p.A[1] + p.B[1] + p.C[1]) / 3], out = (q, d) => {
        const dx = q[0] - cen[0], dy = q[1] - cen[1], l = Math.hypot(dx, dy) || 1;
        return [q[0] + dx / l * d, q[1] + dy / l * d];
    }, e = (a, b, l) => {
        const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
        return [dx / d * l, dy / d * l];
    };
    const V = p[S.tg], o = S.tg == 'B' ? p.A : p.B;
    if (S.noTri && S.scene) {
        $('fig').innerHTML = DEFS + sceneArt(S.scene, p);
        return;
    }
    let h = DEFS + (S.scene ? sceneArt(S.scene, p) : '') + ctxPoly() + (S.scene ? '' : `<polygon points="${[p.A, p.B, p.C].map(q => q.join(',')).join(' ')}" fill="url(#tg)" filter="url(#sh)"/>`) + `<circle cx="${V[0]}" cy="${V[1]}" r="12" fill="#fef3c7"/>`;
    for (const n in sd) {
        const [a, b] = sd[n], r = role(n), big = S.mark == n || S.hi == n, col = S.show || S.nest || S.mark == n ? C[r] : S.hi == n ? '#dc2626' : '#64748b';
        h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${big ? 7 : 5}" stroke-linecap="round" stroke-opacity="${S.nest ? .4 : 1}"${S.scene ? ' stroke-dasharray="7 6"' : ''}/>`;
        let t = '';
        if (S.show && !S.lab)
            t += N[r];
        if (S.lab)
            t += svgM(fa(S.lab[n]));
        else if (S.nums)
            t += ' ' + fa({ AC: 3, BC: 4, AB: 5 }[n] * (S.nest ? 3 : S.k));
        if (t && S.lab && String(S.lab[n]).includes('√')) {
            const q = out(m(a, b), 20);
            h += `<foreignObject x="${q[0] - 36}" y="${q[1] - 14}" width="72" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;justify-content:center;align-items:center;height:28px;font:700 15px sans-serif;color:${TC[r]};text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;direction:ltr">${fxi(String(S.lab[n]))}</div></foreignObject>`;
        }
        else if (t) {
            const q = out(m(a, b), 20);
            h += `<text class=hl x="${q[0]}" y="${q[1]}" fill="${S.show || S.nest ? TC[r] : '#334155'}" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">${t}</text>`;
        }
    }
    if (S.nest) {
        const f = S.nest, L = (a, b) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], D = L(p.B, p.C), E = L(p.B, p.A);
        h += `<polygon points="${[p.B, D, E].map(q => q.join(',')).join(' ')}" fill="#c7d2fe88"/>`;
        for (const [a, b, r] of [[p.B, D, 'adj'], [D, E, 'opp'], [p.B, E, 'hyp']])
            h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${S.nhi && r == 'opp' ? '#dc2626' : C[r]}" stroke-width="5" stroke-linecap="round"/>`;
        const g = e(D, p.B, 9), w = e(D, E, 9);
        h += `<path d="M${D[0] + g[0]} ${D[1] + g[1]}l${w[0]} ${w[1]}l${-g[0]} ${-g[1]}" fill="none" stroke="#334155" stroke-width="1.6"/>`;
        for (const [n, q] of [['D', D], ['E', E]]) {
            const z = out(q, 15);
            h += `<text class=hl x="${z[0]}" y="${z[1]}" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">${n}</text>`;
        }
    }
    if (S.beam) {
        const [a, b] = sd[S.tg == 'B' ? 'AC' : 'BC'], M = m(a, b), L = Math.hypot(M[0] - V[0], M[1] - V[1]);
        h += `<line x1="${V[0]}" y1="${V[1]}" x2="${M[0]}" y2="${M[1]}" stroke="#f59e0b" stroke-width="3" stroke-dasharray="${L}" stroke-dashoffset="${S.anim ? L : 0}" style="${S.anim ? 'animation:bm .7s forwards' : ''}"/><circle cx="${M[0]}" cy="${M[1]}" r="5" fill="#f59e0b"/>`;
        S.anim = 0;
    }
    const a1 = e(V, p.C, 26), a2 = e(V, o, 26), cr = a1[0] * a2[1] - a1[1] * a2[0];
    h += `<path d="M${V[0]} ${V[1]}L${V[0] + a1[0]} ${V[1] + a1[1]}A26 26 0 0 ${cr > 0 ? 1 : 0} ${V[0] + a2[0]} ${V[1] + a2[1]}Z" fill="#fde68acc" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>`;
    if (S.angL) {
        const mx = a1[0] + a2[0], my = a1[1] + a2[1], ml = Math.hypot(mx, my) || 1;
        h += `<text class=hl x="${V[0] + mx / ml * 46}" y="${V[1] + my / ml * 46}" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">${S.angL}</text>`;
    }
    const u1 = e(p.C, p.B, 11), v1 = e(p.C, p.A, 11);
    h += `<path d="M${p.C[0] + u1[0]} ${p.C[1] + u1[1]}l${v1[0]} ${v1[1]}l${-u1[0]} ${-u1[1]}" fill="#e0e7ff" stroke="#334155" stroke-width="1.8"/>`;
    for (const n in p) {
        const q = out(p[n], 16);
        h += `<circle cx="${p[n][0]}" cy="${p[n][1]}" r="4.5" fill="#fff" stroke="#334155" stroke-width="2"/>`;
        h += `<text class=hl x="${q[0]}" y="${q[1]}" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">${n}</text>`;
    }
    if (S.pick)
        for (const n in sd) {
            const [a, b] = sd[n];
            h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="28" onclick="pick('${n}')"/>`;
        }
    $('fig').innerHTML = h;
}

const DEFS = '<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#fce7f3"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#f0f9ff"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#4ade80"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><clipPath id="rc"><rect width="300" height="250" rx="14"/></clipPath><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4338ca" flood-opacity=".22"/></filter></defs>';

const ladderS = (A, B) => {
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), nx = -dy / L * 4.5, ny = dx / L * 4.5;
    let r = `<path d="M${A[0] + nx} ${A[1] + ny}L${B[0] + nx} ${B[1] + ny}M${A[0] - nx} ${A[1] - ny}L${B[0] - nx} ${B[1] - ny}" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>`;
    for (let t = .1; t < .97; t += .1) {
        const x = A[0] + dx * t, y = A[1] + dy * t;
        r += `<path d="M${x - nx} ${y - ny}L${x + nx} ${y + ny}" stroke="#78350f" stroke-width="2.5"/>`;
    }
    return r;
};

const sunS = (x, y) => `<circle cx="${x}" cy="${y}" r="24" fill="#fde047" opacity=".3"/><circle cx="${x}" cy="${y}" r="14" fill="#fde047"/><g stroke="#facc15" stroke-width="3" stroke-linecap="round">${[0, 45, 90, 135, 180, 225, 270, 315].map(a => {
    const c = Math.cos(a * Math.PI / 180), d = Math.sin(a * Math.PI / 180);
    return `<path d="M${x + c * 19} ${y + d * 19}L${x + c * 26} ${y + d * 26}"/>`;
}).join('')}</g>`;

const boxS = (x, y, w, h, f, sd, tp) => `<polygon points="${x},${y} ${x - 13},${y - 8} ${x - 13},${y + h - 8} ${x},${y + h}" fill="${sd}"/><polygon points="${x},${y} ${x + w},${y} ${x + w - 13},${y - 8} ${x - 13},${y - 8}" fill="${tp}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;

const cloudS = (x, y, k) => `<g fill="#fff" opacity=".9"><ellipse cx="${x}" cy="${y}" rx="${16 * k}" ry="${7 * k}"/><ellipse cx="${x + 10 * k}" cy="${y - 5 * k}" rx="${11 * k}" ry="${7 * k}"/><ellipse cx="${x - 9 * k}" cy="${y - 3 * k}" rx="${9 * k}" ry="${6 * k}"/></g>`;

const winS = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="url(#gl)" stroke="#0369a1" stroke-width="1.8"/><path d="M${x + w / 2} ${y}V${y + h}M${x} ${y + h / 2}H${x + w}" stroke="#0369a1" stroke-width="1.2"/>`;

function raysS(A, B, g) {
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    let r = '';
    [0, 26, 52].forEach(o => {
        const px = A[0] + uy * o, py = A[1] - ux * o, t0 = -py / uy, t1 = (g - py) / uy;
        r += `<path d="M${px + ux * t0} 0L${px + ux * t1} ${g}" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round" opacity="${o ? .5 : 1}"/>`;
    });
    return r;
}

function sceneArt(sc, p) {
    const [A, B, C] = [p.A, p.B, p.C], g = C[1], W = Math.min(80, C[0] - 24), x0 = C[0] - W;
    let h = `<g clip-path="url(#rc)"><rect width="300" height="250" fill="url(#sky)"/>${cloudS(210, 52, 1)}${cloudS(110, 36, .8)}<path d="M0 ${g - 26}C60 ${g - 60} 120 ${g - 16} 190 ${g - 42}S280 ${g - 30} 300 ${g - 40}V${g}H0Z" fill="#a7f3d0"/><rect x="0" y="${g}" width="300" height="${250 - g}" fill="url(#gs)"/><path d="M0 ${g}H300" stroke="#22c55e" stroke-width="3"/>`;
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, sX = Math.max(26, Math.min(130, A[0] - A[1] / uy * ux));
    if (sc == 'ladder') {
        const top = A[1] - 22;
        h += `<ellipse cx="${C[0] - W / 2}" cy="${g + 5}" rx="${W / 2 + 14}" ry="6" fill="#166534" opacity=".25"/>` + boxS(x0, top, W, g - top, '#fde68a', '#d9a441', '#fff0b3') + `<polygon points="${x0 - 6},${top} ${x0 + W / 2},${top - 30} ${x0 + W / 2 - 13},${top - 38} ${x0 - 19},${top - 8}" fill="#b91c1c"/><polygon points="${x0 - 6},${top} ${C[0] + 6},${top} ${x0 + W / 2},${top - 30}" fill="#ef4444" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round"/><rect x="${x0 + W - 22}" y="${top - 34}" width="9" height="18" fill="#7f1d1d"/>` + winS(x0 + 10, top + 10, 22, 22) + `<rect x="${x0 + W - 32}" y="${g - 38}" width="22" height="38" rx="3" fill="#92400e"/><circle cx="${x0 + W - 14}" cy="${g - 19}" r="2" fill="#fde047"/>` + sunS(266, 30) + `<ellipse cx="${B[0]}" cy="${g + 3}" rx="14" ry="4" fill="#166534" opacity=".3"/>` + ladderS(A, B);
    }
    if (sc == 'bld') {
        h += sunS(sX, 26) + raysS(A, B, g) + `<rect x="${C[0]}" y="${g - 3}" width="${B[0] - C[0]}" height="9" rx="4" fill="#334155" opacity=".28"/>` + boxS(x0, A[1], W, g - A[1], '#cbd5e1', '#94a3b8', '#e2e8f0');
        for (let y = A[1] + 10; y < g - 36; y += 24)
            for (let x = x0 + 8; x < C[0] - 20; x += 26)
                h += winS(x, y, 16, 14);
        h += `<rect x="${C[0] - 30}" y="${g - 28}" width="20" height="28" rx="2" fill="#92400e"/>`;
    }
    if (sc == 'tree') {
        h += sunS(sX, 26) + raysS(A, B, g) + `<rect x="${C[0]}" y="${g - 3}" width="${B[0] - C[0]}" height="9" rx="4" fill="#334155" opacity=".28"/><ellipse cx="${C[0]}" cy="${g + 4}" rx="30" ry="7" fill="#166534" opacity=".3"/><path d="M${C[0]} ${g}L${A[0]} ${A[1]}" stroke="#78350f" stroke-width="13" stroke-linecap="round"/><path d="M${C[0] - 3} ${g}L${A[0] - 3} ${A[1]}" stroke="#a16207" stroke-width="5" stroke-linecap="round"/><circle cx="${A[0]}" cy="${A[1] - 12}" r="32" fill="#15803d"/><circle cx="${A[0] - 14}" cy="${A[1] - 2}" r="22" fill="#22c55e"/><circle cx="${A[0] + 16}" cy="${A[1] - 4}" r="20" fill="#4ade80"/><circle cx="${A[0] - 6}" cy="${A[1] - 24}" r="12" fill="#86efac" opacity=".7"/>`;
    }
    if (sc == 'ramp') {
        const top = A[1] - 42;
        h += sunS(266, 30) + boxS(x0, top, W, g - top, '#e5e7eb', '#cbd5e1', '#f3f4f6') + `<rect x="${C[0] - 28}" y="${top + 4}" width="26" height="${A[1] - top - 4}" rx="3" fill="#7c3aed"/><circle cx="${C[0] - 8}" cy="${top + 22}" r="2" fill="#fde047"/><polygon points="${A[0]},${A[1]} ${B[0]},${B[1]} ${B[0] - 13},${B[1] - 8} ${A[0] - 13},${A[1] - 8}" fill="#6b7280"/><polygon points="${A} ${B} ${C}" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>`;
        for (const t of [0, .5, 1]) {
            const x = A[0] + (B[0] - A[0]) * t, y = A[1] + (B[1] - A[1]) * t;
            h += `<path d="M${x} ${y}V${y - 16}" stroke="#334155" stroke-width="2.5"/>`;
        }
        h += `<path d="M${A[0]} ${A[1] - 16}L${B[0]} ${B[1] - 16}" stroke="#334155" stroke-width="3" stroke-linecap="round"/>`;
    }
    return h + '</g>';
}

function go(i, p = 0) {
    st = i;
    ph = p;
    pf = null;
    Object.assign(S, { th: 0, fl: 1, k: 3, tg: 'B', show: false, nums: false, beam: null, hi: null, mark: null, pick: false, nest: 0, nhi: 0, bw: 4, bh: 3, ctx: 0, lab: 0, scene: 0, ox: 0, oy: 0, angL: 0, noTri: 0 });
    if (i == 0)
        S.pick = true;
    if (i == 1)
        S.hi = 'AC';
    if (i == 2 || i == 5)
        streak = 0;
    if (i == 4) {
        S.k = 3.6;
        S.nest = 1 / 3;
        S.nt = 1;
        vis = {};
    }
    if (i == 5)
        lv = 0;
    if (i == 6) {
        S.show = true;
        spok = false;
        Object.assign(S, SP[0].s);
    }
    if (i == 3) {
        S.k = 1;
        S.show = true;
        S.nums = true;
        rows = [];
        q1 = false;
        done = false;
    }
    render();
}

function render() {
    if (qt) {
        clearInterval(qt);
        qt = 0;
    }
    if (st < 0) {
        st == -1 ? menuV() : st == -2 ? lessonV() : areaV();
        return;
    }
    $('figc').style.display = (st == 10 || st == 11) ? 'none' : '';
    $('prog').innerHTML = `<button onclick="back()">${st == 14 ? 'بازگشت به آموزش' : st >= 12 ? 'بازگشت به مساحت' : st >= 10 ? 'بازگشت به منو' : 'بازگشت به آموزش'}</button>`;
    [m1, m2, m3, fac, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13, m14][st]();
    draw();
}

function pick(n) {
    if (st == 0) {
        if (role(n) == 'opp') {
            S.mark = n;
            S.pick = false;
            S.beam = 1;
            S.anim = 1;
            ph = 1;
            render();
        }
        else {
            S.beam = 1;
            S.anim = 1;
            draw();
            note('bad', 'نه. پرتو نور از رأس B وارد زاویه می‌شود و به ضلع روبه‌رو می‌خورد؛ آن ضلع «مقابل» است. دوباره لمس کن.');
        }
    }
    else if (st == 2) {
        ok0 = role(n) == ask;
        streak = ok0 ? streak + 1 : 0;
        S.pick = false;
        S.show = true;
        S.beam = 1;
        S.anim = 1;
        ph = 2;
        render();
    }
    else if (st == 5) {
        sel.push(role(n));
        selN.push(n);
        S.hi = n;
        if (sel.length == 1) {
            render();
            return;
        }
        S.hi = null;
        ok0 = sel[0] == DEF[ask][0] && sel[1] == DEF[ask][1];
        streak = ok0 ? streak + 1 : 0;
        S.pick = false;
        S.show = true;
        S.beam = 1;
        S.anim = 1;
        ph = 2;
        render();
    }
}

function home(m = -1) {
    st = m;
    Object.assign(S, { th: 0, fl: 1, k: 3, tg: 'B', show: false, nums: false, beam: null, hi: null, mark: null, pick: false, nest: 0, nhi: 0, bw: 4, bh: 3, ctx: 0, lab: 0, scene: 0, ox: 0, oy: 0, angL: 0, noTri: 0 });
    render();
}

function back() {
    if (st == 14)
        home(-2);
    else if (st >= 12)
        home(-3);
    else if (st >= 10)
        home();
    else
        home(-2);
}

function m1() {

        put(`<p>کمان زرد، زاویه‌ی <b>B</b> است. ضلع <span class=o>مقابل</span> این زاویه را لمس کن.</p><div id=note></div>`);

        $('nx').disabled = false;
    }

        $('note').innerHTML = '';
}

const opts = () => ['opp', 'adj', 'hyp'].map(r => `<button onclick="q2('${r}')">${N[r]}</button>`).join('');

function q2(r) {
    if (role('AC') == r) {
        ph++;
        if (ph == 1)
            S.tg = 'A';
        S.beam = ph == 2 ? 1 : null;
        S.anim = 1;
        render();
    }
    else {
        S.beam = 1;
        S.anim = 1;

function m2() {
    if (ph == 0)
        put(`<p>ضلع <b style="color:#dc2626">قرمز (AC)</b> نسبت به زاویه‌ی <b>B</b> چیست؟</p>${opts()}<div id=note></div>`);

        put(msg('info', 'حالا زاویه را عوض کردیم: زاویه‌ی <b>A</b>.') + `<p>ضلع <b style="color:#dc2626">قرمز (AC)</b> نسبت به زاویه‌ی <b>A</b> چیست؟</p>${opts()}<div id=note></div>`);

}

function m3() {

const pfm = (a, b) => pf == null ? '' : msg(pf ? 'good' : 'info', pf ? a : b);

const add = k => {
    S.k = k;
    if (!rows.some(r => r.t == S.tg && r.k == k))

};

function fac() {

        return;
    }
    const tr = rows.map(r => {
        const o = (r.t == 'B' ? 3 : 4) * r.k, hy = 5 * r.k;
        return `<tr><td>${r.t}</td><td>${fa(o)}</td><td>${fa(hy)}</td><td><span class=fr><i>${fa(o)}</i><i>${fa(hy)}</i></span></td><td>${fa(o / hy)}</td></tr>`;
    }).join('');
    const nB = rows.filter(r => r.t == 'B').length, nA = rows.length - nB;
    let a;
    const q2 = `<p><b>سوال:</b> نسبت «مقابل به وتر» فقط به چه چیزی بستگی دارد؟</p><button onclick="sen(0)">اندازه‌ی ضلع‌ها</button><button onclick="sen(1)">اندازه‌ی زاویه</button>`;

    else
        a = q2;
    put((q1 ? '' : pfm('پیش‌بینی‌ات درست بود! حالا با جدول مطمئن شو.', 'پیش‌بینی‌ات با واقعیت فرق داشت؛ بیا با جدول بررسی کنیم.')) + `<p>اندازه را انتخاب کن تا به جدول اضافه شود.</p>${[1, 2, 3].map(k => `<button class="${S.k == k ? 'pri' : ''}" onclick="add(${k})">×${fa(k)}</button>`).join('')}<br><button onclick="S.tg=S.tg=='B'?'A':'B';render()">زاویه‌ی فعلی: ${S.tg} (تغییر)</button><table><tr><th>زاویه</th><th>مقابل</th><th>وتر</th><th>نسبت</th><th>عدد</th></tr>${tr}</table>${a}<div id=note></div>`);
}

function a1(i) {
    if (i == 2) {
        q1 = true;
        render();
    }
    else
        note('bad', 'به ستون آخر جدول نگاه کن: در همه‌ی ردیف‌های B عدد یکی است؟');
}

function sen(i) {
    if (i) {

        render();
    }
    else
        note('bad', 'به ستون آخر نگاه کن: وقتی اندازه‌ی ضلع‌ها عوض شد، عدد آخر هم عوض شد؟ وقتی زاویه عوض شد چه؟');
}

const H4 = ['', 'هر دو مثلث قائمه‌اند و زاویه‌ی B مشترک است.', 'ضلعی را پیدا کن که در هر دو مثلث روبه‌روی زاویه‌ی B است.', 'طرفین و وسطین: DE×AB = AC×BE. حالا دوباره کسر بساز.', 'ستون آخر را برای ×۱ و ×۲ مقایسه کن؛ هر سه ردیف را ببین.'];

function a4(ok) {
    if (ok) {
        ph++;
        render();
    }
    else
        note('bad', H4[ph]);
}

function nt(t) {
    S.nt = t;
    S.nest = t / 3;
    vis[t] = 1;
    render();
}

function m4() {
    S.nhi = ph == 2 ? 1 : 0;
    if (ph == 0)
        put(`<p><b>فرض:</b> دو مثلث قائم‌الزاویه‌ی ABC و DBE زاویه‌ی حاده‌ی B را مشترک دارند.</p><p><b>حکم:</b> نسبت «مقابل به وتر» در هر دو برابر است؛ یعنی ${lf('DE', 'BE')} = ${lf('AC', 'AB')}</p><p>آزمایش به‌تنهایی اثبات نیست؛ پس حکم را قدم‌به‌قدم اثبات می‌کنیم.</p><p><b>پیش‌بینی کن:</b> کسر اول، نسبت «مقابل به وتر» در مثلث کوچک DBE است و کسر دوم همین نسبت در مثلث بزرگ ABC. این دو چه رابطه‌ای دارند؟</p><p style="text-align:center">${lf('DE', 'BE')} ؟ ${lf('AC', 'AB')}</p><button onclick="pf=1;a4(1)">برابرند</button><button onclick="pf=0;a4(1)">اولی بزرگ‌تر است</button><button onclick="pf=0;a4(1)">اولی کوچک‌تر است</button>`);
    if (ph == 1)
        put(pfm('پیش‌بینی‌ات درست بود! حالا آن را اثبات می‌کنیم.', 'پیش‌بینی‌ات با حکم فرق داشت؛ بیا اثبات کنیم.') + `<p><b>گام ۱:</b> زاویه‌های دو مثلث ABC و DBE را مقایسه کن. کدام زاویه‌ها برابرند؟</p><button onclick="a4(0)">فقط زاویه‌ی B</button><button onclick="a4(1)">B مشترک است و D و C هر دو ۹۰° هستند</button><button onclick="a4(0)">هیچ زاویه‌ای برابر نیست</button><div id=note></div>`);

        put(msg('good', 'درست است. پس طبق حالت دو زاویه، دو مثلث متشابه‌اند.') + `<p><b>گام ۲:</b> ضلع قرمز DE در مثلث ABC با کدام ضلع متناظر است؟</p><button onclick="a4(1)">AC</button><button onclick="a4(0)">BC</button><button onclick="a4(0)">AB</button><div id=note></div>`);
    if (ph == 3)
        put(msg('good', 'DE متناظر AC است. پس اضلاع متناظر متناسب‌اند:') + `<p style="text-align:center">${lf('DE', 'AC')} = ${lf('BD', 'BC')} = ${lf('BE', 'AB')}</p><p><b>گام ۳:</b> از ${lf('DE', 'AC')} = ${lf('BE', 'AB')} کدام نتیجه درست است؟</p><button onclick="a4(1)">${lf('DE', 'BE')} = ${lf('AC', 'AB')}</button><button onclick="a4(0)">${lf('DE', 'BE')} = ${lf('AB', 'AC')}</button><button onclick="a4(0)">${lf('DE', 'AB')} = ${lf('AC', 'BE')}</button><div id=note></div>`);
    if (ph == 4) {
        vis[S.nt] = 1;
        const I = { opp: 3 * S.nt, adj: 4 * S.nt, hyp: 5 * S.nt }, O = { opp: 9, adj: 12, hyp: 15 };
        const tr = [['opp', 'hyp'], ['adj', 'hyp'], ['opp', 'adj']].map(([n, d]) => `<tr><td>${frs(n, d)}</td><td>${nf(I[n], I[d])}</td><td>${nf(O[n], O[d])}</td><td>${dec(O[n] / O[d])}</td></tr>`).join('');
        put(msg('good', 'حکم ثابت شد: نسبت مقابل به وتر به اندازه‌ی مثلث بستگی ندارد.') + `<p><b>گام ۴:</b> حالا امتحان کن. اندازه‌ی مثلث DBE را عوض کن:</p>${[1, 2].map(t => `<button class="${S.nt == t ? 'pri' : ''}" onclick="nt(${t})">×${fa(t)}</button>`).join('')}<table><tr><th>نسبت</th><th>DBE</th><th>ABC</th><th>عدد</th></tr>${tr}</table>` + (vis[1] && vis[2] ? `<p><b>سوال:</b> با تغییر اندازه‌ی DBE کدام نسبت‌ها ثابت ماندند؟</p><button onclick="a4(0)">فقط مقابل/وتر</button><button onclick="a4(1)">هر سه نسبت</button><button onclick="a4(0)">هیچ‌کدام</button>` : '') + '<div id=note></div>');
    }
    if (ph == 5) {
        S.nest = 0;
        fin('B');
        put(msg('good', 'درست است! این نسبت‌ها فقط به زاویه بستگی دارند؛ پس برای هر زاویه اسم می‌گیرند.') + NM('سینوس', 'sin B', frs('opp', 'hyp')) + NM('کسینوس', 'cos B', frs('adj', 'hyp')) + NM('تانژانت', 'tan B', frs('opp', 'adj')) + NM('کتانژانت (معکوس تانژانت)', 'cot B', frs('adj', 'opp')) + `<button class=pri onclick="back()">بازگشت به منو ◀</button>`);
    }
}

const LV = ['sin', 'cos', 'tan', 'cot', 0], LN = ['سینوس', 'کسینوس', 'تانژانت', 'کتانژانت', 'ترکیبی'], NEED = [2, 2, 2, 2, 3];

function m5() {
    if (ph == 0) {
        ask = LV[lv] || Object.keys(DEF)[Math.random() * 4 | 0];
        Object.assign(S, { th: Math.random() * 360, fl: Math.random() < .5 ? 1 : -1, k: 2 + Math.random() * 1.5, tg: Math.random() < .5 ? 'B' : 'A', show: false, nums: false, beam: null, pick: true, hi: null });
        sel = [];
        selN = [];
        ph = 1;
    }
    const nd = NEED[lv], d = '●'.repeat(streak) + '○'.repeat(nd - streak), hd = `<small>مرحله ${fa(lv + 1)} از ۵: ${LN[lv]}</small>`;

        put(hd + `<p>برای زاویه‌ی <b>${S.tg}</b> مقدار <b dir=ltr>${ask} ${S.tg}</b> را بساز: اول ضلع <b>صورت</b>، بعد ضلع <b>مخرج</b> را روی شکل لمس کن.</p><div class=fm><span>${ask} ${S.tg} =</span>${lf(selN[0] || '؟', selN[1] || '؟')}</div><div dir=ltr style="text-align:center">${d}</div><small>${fa(nd)} جواب درست پشت‌سرهم لازم است.</small>`);
    if (ph == 2) {

    }
}

const Hs = { A: [170, 50], tg: 'B', alt: 0, show: 0, pick: 0, cur: null, drag: 0, hi: null };

let Hq = 'opp', Hr = 'sin', hk = 0, hc = 0, Hok = true;

const hSd = () => ({ hyp: Hs.tg == 'B' ? 'AB' : 'AC', adj: Hs.tg == 'B' ? 'BH' : 'CH' });

const roleH = n => {
    const q = hSd();
    return n == 'AH' ? 'opp' : n == q.hyp ? 'hyp' : n == q.adj ? 'adj' : null;
};

function newH() {
    Hs.A = [100 + Math.random() * 110, 45 + Math.random() * 45];
    Hs.tg = Math.random() < .5 ? 'B' : 'C';
    Hs.cur = null;
    Hs.drag = 0;
    Hs.B = null;
    Hs.K = null;
    Hs.ex = 0;
    Hs.lab = null;
    Hs.angs = null;
    Hs.scn = 0;
}

function drawH() {
    const A = Hs.A, B = Hs.B || [40, 205], K = Hs.K || [260, 205], H = [A[0], 205], V = Hs.tg == 'B' ? B : K, O = Hs.tg == 'B' ? K : B, u = (a, b, l) => {
        const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
        return [dx / d * l, dy / d * l];
    };
    if (Hs.scn == 1) {
        $('fig').innerHTML = DEFS + sceneP(A, B, K, H);
        return;
    }
    let h = DEFS + (Hs.scn == 2 ? sceneP(A, B, K, H) : `<polygon points="${A} ${B} ${K}" fill="url(#tg)" filter="url(#sh)"/>`);
    const sg = Hs.alt ? [['AH', A, H], ['AB', A, B], ['AC', A, K], ['BH', B, H], ['CH', H, K]] : [['AB', A, B], ['AC', A, K], ['BC', B, K]];
    for (const [n, a, b] of sg) {
        const r = Hs.show && Hs.alt ? roleH(n) : null, hh = Hs.hi && Hs.hi.includes(n), col = hh ? '#dc2626' : (r ? C[r] : (n == 'AH' && !Hs.pick ? '#dc2626' : '#64748b'));
        h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${r || hh || n == 'AH' ? 6 : 5}" stroke-linecap="round" stroke-opacity="${Hs.show && Hs.alt && !r ? .35 : 1}"/>`;
    }
    if (Hs.alt) {
        const ux = (V[0] > H[0] ? 1 : -1) * 10;
        h += `<path d="M${H[0] + ux} ${H[1]}v-10h${-ux}" fill="#e0e7ff" stroke="#334155" stroke-width="1.6"/>`;
    }
    if (Hs.cur)
        h += `<line x1="${A[0]}" y1="${A[1]}" x2="${Hs.cur[0]}" y2="${Hs.cur[1]}" stroke="#dc2626" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>`;
    const e1 = u(V, O, 26), e2 = u(V, A, 26), cr = e1[0] * e2[1] - e1[1] * e2[0];
    h += `<path d="M${V[0]} ${V[1]}L${V[0] + e1[0]} ${V[1] + e1[1]}A26 26 0 0 ${cr > 0 ? 1 : 0} ${V[0] + e2[0]} ${V[1] + e2[1]}Z" fill="#fde68acc" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>`;
    if (Hs.ex) {
        for (const [Vv, Oo, lt] of [[B, K, Hs.angs.B], [K, B, Hs.angs.C]]) {
            const a1 = u(Vv, Oo, 26), a2 = u(Vv, A, 26), c2 = a1[0] * a2[1] - a1[1] * a2[0], mx = a1[0] + a2[0], my = a1[1] + a2[1], ml = Math.hypot(mx, my) || 1;
            h += `<path d="M${Vv[0]} ${Vv[1]}L${Vv[0] + a1[0]} ${Vv[1] + a1[1]}A26 26 0 0 ${c2 > 0 ? 1 : 0} ${Vv[0] + a2[0]} ${Vv[1] + a2[1]}Z" fill="#fde68acc" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/><text class=hl x="${Vv[0] + mx / ml * 50}" y="${Vv[1] + my / ml * 50}" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">${lt}</text>`;
        }

function attachH() {
    const f = $('fig');
    if (!f || !f.addEventListener)
        return;
    const xy = e => {
        const r = f.getBoundingClientRect();
        return [(e.clientX - r.left) / r.width * 300, (e.clientY - r.top) / r.height * 250];
    };
    f.addEventListener('pointerdown', e => {
        if (dragOK()) {
            const q = xy(e);
            if (Math.hypot(q[0] - Hs.A[0], q[1] - Hs.A[1]) < 34) {
                Hs.drag = 1;
                Hs.cur = q;
                try {
                    f.setPointerCapture(e.pointerId);
                }
                catch (x) {
                }
                e.preventDefault();
            }
        }
    });
    f.addEventListener('pointermove', e => {
        if (Hs.drag) {
            Hs.cur = xy(e);
            drawH();
            e.preventDefault();
        }
    });
    f.addEventListener('pointerup', e => {
        if (Hs.drag) {
            Hs.drag = 0;
            const q = xy(e);
            Hs.cur = null;
            if (Math.hypot(q[0] - Hs.A[0], q[1] - 205) < 38) {
                Hs.alt = 1;
                if (ph == 3)

    }
    const e1 = un(O, P, 26), e2 = un(O, Q, 26), cr = e1[0] * e2[1] - e1[1] * e2[0], bx = e1[0] + e2[0], bz = e1[1] + e2[1], bl = Math.hypot(bx, bz) || 1;

    if (g.ex2)
        for (const k of ['p', 'q']) {
            const V = k == 'p' ? P : Q, d = un(V, cn, 30);
            h += `<text class=hl x="${V[0] + d[0]}" y="${V[1] + d[1]}" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="middle">${g.ex2[k]}</text>`;
        }
    for (const [k, V] of [['o', O], ['p', P], ['q', Q]]) {

        h += `<circle cx="${V[0]}" cy="${V[1]}" r="4.5" fill="#fff" stroke="#334155" stroke-width="2"/><text class=hl x="${z[0]}" y="${z[1]}" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">${nm[k]}</text>`;

    }
    if (L.h && hasAlt)

    f.innerHTML = h;
}

    const m = WM[k] || ['آفرین!', 'یک بخش را تمام کردی.'], n = ALLK.filter(x => DN[x]).length, all = n == ALLK.length, d = document.createElement('div');
    d.className = 'win';
    d.innerHTML = `<div class="wc">${ring(n, ALLK.length, 96, 'rg2')}<h3>${all ? 'قهرمان مثلثات شدی!' : m[0]}</h3><p>${all ? 'هر ۱۲ بخش را تمام کردی. دمت گرم!' : m[1]}</p><small>${fa(n)} از ${fa(ALLK.length)} بخش تمام شد</small><br><button class="pri" onclick="this.closest('.win').remove()">ادامه ◀</button></div>`;
    document.body.appendChild(d);
}

function menuV() {
    $('figc').style.display = 'none';
    $('prog').innerHTML = '';
    const L = SEC.filter(x => LK.includes(x[0])), n = L.filter(x => DN[x[0]]).length;
    put(progCard(ALLK, 'بخش') + tileH('A', 'آموزش تعاملی', `${fa(n)} از ${fa(L.length)} بخش تمام شده`, 'home(-2)', 0, n == L.length) + tileH('K', 'محاسبه‌ی مساحت', 'دو روش: با ارتفاع و با زاویه‌ی بین دو ضلع؛ آموزش و تمرین', 'home(-3)', 6, DN.K1 && DN.K2) + tileH('I', 'آزمون', 'بدون زمان و زمان‌دار؛ ۱۰ سوال و امتیاز', 'go(10)', 4, DN.I) + tileH('J', 'فلش‌کارت مرور', 'مقدارهای مهم زاویه‌ها از ۰° تا ۲۷۰°', 'go(11)', 5, DN.J) + '<button class="reset" onclick="resetAll()">پاک کردن پیشرفت</button>');
}

const GROUPS = [
    ['بشناس', 'اضلاع و نسبت‌ها را بشناس', ['A', 'B']],
    ['بساز', 'نسبت‌ها را خودت بساز و ثابت کن', ['D', 'E', 'F']],
    ['به‌کار ببر', 'مسئله‌های واقعی را حل کن', ['G', 'H', 'T']]
];
const SHORT = {
    A: 'مقابل، مجاور و وتر',
    B: 'کشف و اثبات ثابت بودن نسبت‌ها',
    D: 'ساختن نسبت‌ها روی شکل',
    E: 'مقدار نسبت‌ها در ۳۰°، ۴۵° و ۶۰°',
    F: 'دو رابطه‌ی اصلی بین sin، cos و tan',
    G: 'نردبان، سایه، رمپ و درخت',
    H: 'مثلث غیرقائم را به مثلث قائم تبدیل کن',
    T: 'بالن و تیر پرچم با دو طناب'
};
let openG = [];
function toggleG(gi, btn) {
    openG[gi] = !openG[gi];
    btn.classList.toggle('on', openG[gi]);
    btn.nextElementSibling.classList.toggle('open', openG[gi]);
}
function lessonV() {
    $('figc').style.display = 'none';
    $('prog').innerHTML = '<button onclick="home()">بازگشت به منو</button>';
    const byKey = Object.fromEntries(SEC.filter(x => LK.includes(x[0])).map(x => [x[0], x]));
    const nextK = LK.find(k => !DN[k]);
    openG = GROUPS.map(g => g[2].includes(nextK));
    let num = 0;
    const cont = nextK
        ? `<button class="cont" onclick="go(${byKey[nextK][3]})"><span><small>ادامه بده از</small><b>${byKey[nextK][1]}</b></span><i>◀</i></button>`
        : msg('good', 'همه‌ی بخش‌های آموزش را تمام کردی!');
    const groups = GROUPS.map(([title, desc, keys], gi) => {
        const steps = keys.map(k => {
            num++;
            const x = byKey[k], done = DN[k], isNext = k == nextK;
            return `<button class="step ${done ? 'dn' : ''} ${isNext ? 'nx' : ''}" onclick="go(${x[3]})"><em>${done ? '✓' : fa(num)}</em><span><b>${x[1]}</b><small>${SHORT[k]}</small></span></button>`;
        }).join('');
        const d = keys.filter(k => DN[k]).length;
        return `<div class="grp g${gi}"><button class="gh ${openG[gi] ? 'on' : ''}" onclick="toggleG(${gi},this)"><span><b>${title}</b><small>${desc}</small></span><em>${fa(d)} از ${fa(keys.length)}${d == keys.length ? ' ✓' : ''}</em><i>▾</i></button><div class="gb ${openG[gi] ? 'open' : ''}"><div><div class="in">${steps}</div></div></div></div>`;
    }).join('');
    put(progCard(LK, 'بخش آموزش') + cont + groups);
}
function toggleFS() {
    const d = document, e = d.documentElement;
    try {
        if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
        else (e.requestFullscreen || e.webkitRequestFullscreen).call(e);
    } catch (x) {}
}

function resetAll() {
    if (confirm('همه‌ی پیشرفت و امتیازها پاک شود؟')) {
        DN = {};
        try {
            localStorage.removeItem('trigDN');
        } catch (e) {}
        home();
    }
}

// ════════════════════════════════════════════════════════════
// 17) شروع برنامه
// ════════════════════════════════════════════════════════════

attachH();
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) {
    const fb = document.querySelector('.fs');
    if (fb) fb.style.display = 'none';
}

home();
</script>
